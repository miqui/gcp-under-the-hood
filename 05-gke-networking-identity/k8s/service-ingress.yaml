apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: demo
  annotations:
    cloud.google.com/neg: '{"ingress": true}' # pod-direct container-native LB via NEG
spec:
  selector: {app: app}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: demo
spec:
  defaultBackend:
    service:
      name: app
      port: {number: 80}
